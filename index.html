<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML Example</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f4f7fb;
        color: #222;
      }

      .container {
        max-width: 900px;
        margin: 40px auto;
        padding: 24px;
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      }

      h1 {
        color: #1d4ed8;
      }

      .card {
        padding: 16px;
        border: 1px solid #dfe7f5;
        border-radius: 10px;
        background: #f8fbff;
        margin-top: 20px;
      }

      button {
        background: #2563eb;
        color: #fff;
        border: none;
        border-radius: 8px;
        padding: 10px 16px;
        cursor: pointer;
      }

      button:hover {
        background: #1d4ed8;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Привіт, світ!</h1>
      <p>Це базова HTML-сторінка.</p>

      <div class="card">
        <h2>Приклад блоку</h2>
        <p>Тут може бути текст, зображення або інші елементи веб-сторінки.</p>
        <button type="button">Натисни мене</button>
      </div>

      <div class="card">
        
        <img src="imag/peregon/1s/l.jpg" alt="Лекції" />
      </div>
    </div>
  </body>
</html>
